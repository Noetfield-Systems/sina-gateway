name: Live public boundary smoke
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live-public-boundary.yml'
      - 'scripts/capture-live.mjs'
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify anonymous production boundaries
        env:
          BASE: https://sina-venture-gateway.vercel.app
        run: |
          set -euo pipefail
          curl -fsS "$BASE/" -o /tmp/home.html
          grep -q 'premium-hero-proof' /tmp/home.html
          grep -q 'Expertise Atlas' /tmp/home.html
          ! grep -Eiq '/api/projects|/api/ventures|DATABASE_URL|postgresql://' /tmp/home.html
          for path in /atlas /atlas.html /app.js /aether.js /aether-v7fx.js /api/projects /api/ventures /portfolio/approved.json /lib/portfolio.mjs /work/unapproved-fixture/; do
            test "$(curl -Ls -o /dev/null -w '%{http_code}' "$BASE$path")" = 404
          done
          curl -fsS "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          grep -q "$BASE/" /tmp/sitemap.xml
          grep -q "$BASE/engineering/" /tmp/sitemap.xml
          for path in seekmesh mochiloom triflow persian-llm-reference; do
            grep -q "$BASE/work/$path/" /tmp/sitemap.xml
            curl -fsS "$BASE/work/$path/" -o /dev/null
          done
          curl -fsS "$BASE/work/" -o /tmp/work.html
          grep -q '4 published works' /tmp/work.html
          curl -fsSL "$BASE/engineering/" | grep -q 'Designing a public boundary'
          ! grep -Eiq '/atlas|/private|/api/|github' /tmp/sitemap.xml
          curl -fsS "$BASE/robots.txt" | grep -q 'Disallow: /api/'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/inquiry")" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/api/inquiry")" = 400
          echo GATEWAY_ANONYMOUS_PUBLIC_QA_PASS
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Capture real anonymous production UI
        run: node scripts/capture-live.mjs
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-live-browser-captures
          path: qa-captures/
          if-no-files-found: ignore
